<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スキル合計 組み合わせ抽出ツール</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 920px; margin: 20px auto; padding: 0 15px; color: #333; }
    h2 { border-bottom: 2px solid #007bff; padding-bottom: 8px; }
    .config-panel { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .row label { font-weight: bold; font-size: 14px; }
    .row input[type="number"], .row input[type="text"] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    
    .rule-box { background: #eef2f5; padding: 10px; border-radius: 6px; border-left: 4px solid #17a2b8; margin-top: 5px; }

    .input-section { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 15px; }
    .input-left { flex: 1; min-width: 300px; }
    .input-right { flex: 1; min-width: 280px; background: #f1f3f5; padding: 12px; border-radius: 6px; border: 1px dashed #adb5bd; }
    textarea { width: 100%; height: 160px; font-family: monospace; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    
    .quick-form { display: flex; gap: 8px; margin-bottom: 10px; }
    .quick-form input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    
    .btn-sm { padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; background: #6c757d; color: white; }
    .btn-sm:hover { background: #495057; }
    .btn-main { background: #007bff; color: white; border: none; padding: 10px 24px; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    .btn-main:hover { background: #0056b3; }
    
    .drop-zone { text-align: center; padding: 12px; border: 2px dashed #007bff; background: #fff; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .drop-zone:hover { background: #e7f1ff; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #dee2e6; padding: 8px 12px; text-align: center; font-size: 14px; }
    th { background: #e9ecef; }
    tr:nth-child(even) { background: #f8f9fa; }
    .tag { display: inline-block; background: #e2e3e5; padding: 2px 6px; border-radius: 4px; margin: 1px; font-size: 12px; }
  </style>
</head>
<body>

  <h2>スキル組み合わせ計算ツール</h2>
  
  <!-- 設定パネル -->
  <div class="config-panel">
    <div class="row">
      <label>選ぶ人数: <input type="number" id="teamSize" value="5" min="1" style="width:50px;"></label>
      <label>スキル合計上限: <input type="number" id="maxSkill" value="23" style="width:60px;"></label>
      <label>並び順: 
        <select id="sortOrder" style="padding: 6px; border-radius: 4px;">
          <option value="desc">合計スキル：高い順（降順）</option>
          <option value="asc">合計スキル：低い順（昇順）</option>
        </select>
      </label>
    </div>

    <!-- 新機能: 高スキル人数制限ルール -->
    <div class="rule-box">
      <div class="row" style="margin-bottom: 0;">
        <label>
          <input type="checkbox" id="enableSkillLimit" checked>
          特定スキルの人数制限ルールを適用する
        </label>
      </div>
      <div class="row" style="margin-top: 8px; margin-bottom: 0; font-weight: normal; font-size: 13px;">
        スキルレベル <input type="number" id="highSkillVal" value="6" style="width:50px;"> 以上のメンバーは、
        チーム内に <input type="number" id="maxHighCount" value="2" style="width:50px;"> 人まで（※指定数を超えたら排除）
      </div>
    </div>

    <div class="row" style="margin-top: 12px;">
      <label>【含む】メンバー: <input type="text" id="includeMembers" placeholder="例: A, C" style="width:140px;"></label>
      <label>【除外】メンバー: <input type="text" id="excludeMembers" placeholder="例: B" style="width:140px;"></label>
    </div>
  </div>

  <!-- データ入力エリア -->
  <p><b>▼ メンバーデータ入力</b>（Excel・スプレッドシートからそのまま貼り付け可能）</p>
  
  <div class="input-section">
    <div class="input-left">
      <textarea id="inputText" placeholder="名前|スキル">A|9
B|7
C|6
D|5
E|5
F|3
G|2
H|1</textarea>
      <div style="margin-top: 5px; display: flex; gap: 5px;">
        <button class="btn-sm" onclick="formatData()">データを整形・ソート</button>
        <button class="btn-sm" onclick="clearData()" style="background:#dc3545;">クリア</button>
      </div>
    </div>

    <div class="input-right">
      <b style="font-size: 13px;">1人ずつ追加する:</b>
      <div class="quick-form" style="margin-top: 5px;">
        <input type="text" id="addName" placeholder="名前" style="width: 80px;">
        <input type="number" id="addSkill" placeholder="スキル" style="width: 60px;">
        <button class="btn-sm" onclick="addSingleMember()" style="background: #28a745;">追加</button>
      </div>

      <b style="font-size: 13px;">ファイル読み込み (.csv / .txt):</b>
      <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        クリック または ファイルをドロップ
        <input type="file" id="fileInput" accept=".csv, .txt" style="display: none;" onchange="handleFile(this.files)">
      </div>
    </div>
  </div>

  <div style="margin-bottom: 20px;">
    <button class="btn-main" onclick="calculate()">組み合わせを計算</button>
  </div>

  <div id="result"></div>

  <script>
    function parseMembers() {
      const text = document.getElementById('inputText').value.trim();
      const lines = text.split('\n');
      const members = [];
      
      lines.forEach(line => {
        const parts = line.trim().split(/[\t,| ]+/);
        if (parts.length >= 2) {
          const name = parts[0].trim();
          const skill = parseFloat(parts[1].trim());
          if (name && !isNaN(skill)) members.push({ name, skill });
        }
      });
      return members;
    }

    function addSingleMember() {
      const nameInput = document.getElementById('addName');
      const skillInput = document.getElementById('addSkill');
      const name = nameInput.value.trim();
      const skill = skillInput.value.trim();

      if (!name || skill === '' || isNaN(skill)) {
        alert('名前と正しくスキルを入力してください。');
        return;
      }

      const textarea = document.getElementById('inputText');
      const currentText = textarea.value.trim();
      textarea.value = currentText ? `${currentText}\n${name}|${skill}` : `${name}|${skill}`;
      
      nameInput.value = '';
      skillInput.value = '';
      nameInput.focus();
    }

    function formatData() {
      const members = parseMembers();
      if (members.length === 0) return;
      members.sort((a, b) => b.skill - a.skill);
      const formatted = members.map(m => `${m.name}|${m.skill}`).join('\n');
      document.getElementById('inputText').value = formatted;
    }

    function clearData() {
      document.getElementById('inputText').value = '';
    }

    function handleFile(files) {
      if (files.length === 0) return;
      const file = files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('inputText').value = e.target.result.trim();
        formatData();
      };
      reader.readAsText(file);
    }

    // メイン計算ロジック
    function calculate() {
      const teamSize = parseInt(document.getElementById('teamSize').value);
      const maxSkill = parseInt(document.getElementById('maxSkill').value);
      const sortOrder = document.getElementById('sortOrder').value;
      
      // 高スキル制限設定の取得
      const enableSkillLimit = document.getElementById('enableSkillLimit').checked;
      const highSkillVal = parseFloat(document.getElementById('highSkillVal').value);
      const maxHighCount = parseInt(document.getElementById('maxHighCount').value);

      // フィルタ設定
      const includeInput = document.getElementById('includeMembers').value.trim();
      const excludeInput = document.getElementById('excludeMembers').value.trim();
      const includes = includeInput ? includeInput.split(',').map(s => s.trim().toUpperCase()).filter(s => s) : [];
      const excludes = excludeInput ? excludeInput.split(',').map(s => s.trim().toUpperCase()).filter(s => s) : [];

      const members = parseMembers();

      if (members.length < teamSize) {
        alert(`メンバー数が不足しています（現在 ${members.length} 人 / 必要 ${teamSize} 人）。`);
        return;
      }

      const rawResults = [];

      function backtrack(startIndex, currentCombo, currentSum) {
        if (currentCombo.length === teamSize) {
          if (currentSum <= maxSkill) {
            
            // --- 高スキル保持者の人数チェック（新ロジック） ---
            if (enableSkillLimit) {
              const highSkillCount = currentCombo.filter(m => m.skill >= highSkillVal).length;
              if (highSkillCount > maxHighCount) {
                return; // 指定人数を超えた場合はこの組み合わせを排除
              }
            }

            rawResults.push({
              names: currentCombo.map(m => m.name),
              total: currentSum
            });
          }
          return;
        }

        for (let i = startIndex; i < members.length; i++) {
          backtrack(i + 1, currentCombo.concat(members[i]), currentSum + members[i].skill);
        }
      }

      backtrack(0, [], 0);

      // メンバー指定フィルタリング（含む・除外）
      let filteredResults = rawResults.filter(res => {
        const comboNamesUpper = res.names.map(n => n.toUpperCase());
        const hasAllIncludes = includes.every(inc => comboNamesUpper.includes(inc));
        const hasNoExcludes = !excludes.some(exc => comboNamesUpper.includes(exc));
        return hasAllIncludes && hasNoExcludes;
      });

      // ソート処理
      filteredResults.sort((a, b) => {
        return sortOrder === 'desc' ? b.total - a.total : a.total - b.total;
      });

      // 結果描画
      let html = `<div style="font-weight:bold; margin-bottom: 8px;">該当結果: ${filteredResults.length} 件 (全 ${rawResults.length} 件中)</div>`;
      if (filteredResults.length > 0) {
        html += '<table><thead><tr><th>No.</th><th>メンバー構成</th><th>合計スキル</th></tr></thead><tbody>';
        filteredResults.forEach((res, i) => {
          const membersTag = res.names.map(n => `<span class="tag">${n}</span>`).join(' ');
          html += `<tr>
            <td style="width: 50px;">${i + 1}</td>
            <td style="text-align: left; padding-left: 15px;">${membersTag}</td>
            <td style="width: 110px;"><b>${res.total}</b></td>
          </tr>`;
        });
        html += '</tbody></table>';
      } else {
        html += '<p style="color: #6c757d;">条件に該当する組み合わせは見つかりませんでした。</p>';
      }
      
      document.getElementById('result').innerHTML = html;
    }
  </script>
</body>
</html>
